# Servidor estático do SPA. Roda como não-root, então escuta numa porta alta e
# escreve temporários em /tmp.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Não anuncia a versão do nginx no header Server.
  server_tokens off;

  # Assets com hash no nome (gerados pelo Vite) podem ser cacheados para sempre:
  # qualquer mudança gera um nome novo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # O index NÃO pode ser cacheado: é ele que aponta para os assets novos depois
  # de um deploy. Com cache, o usuário fica preso na versão anterior.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Fallback de SPA: rotas do TanStack Router não existem como arquivo, então
  # qualquer caminho desconhecido devolve o index e o roteamento acontece no
  # browser. Sem isso, recarregar em `/dashboard` dá 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
