# Stack de produção (referência) — Postgres + Redis + API + worker + app.
# Build local + sobe tudo:
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Em produção real você normalmente usa imagens publicadas num registry e um
# Postgres/Redis gerenciados — este compose é o ponto de partida self-contained.
# Ajuste os segredos via `.env` (não comite os reais). Ver UPGRADES.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-boilerplate}
    volumes:
      - postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Migrações: roda uma vez (prisma migrate deploy) e sai. A API/worker só sobem
  # depois que isto completa com sucesso.
  migrate:
    image: boilerplate-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      ['pnpm', '--filter', '@repo/database', 'exec', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_DATABASE:-boilerplate}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: boilerplate-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - '${PORT:-3333}:3333'
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_DATABASE:-boilerplate}?schema=public
      REDIS_URL: redis://redis:6379
      COOKIE_SECRET: ${COOKIE_SECRET:?defina no .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?defina no .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3333}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Worker dedicado abaixo → a API só enfileira.
      JOBS_IN_PROCESS: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3333/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # Worker de jobs (BullMQ). Reusa a imagem da API com outro comando.
  worker:
    image: boilerplate-api:latest
    restart: unless-stopped
    command:
      ['node', '--import', './apps/api/dist/instrument.js', 'apps/api/dist/worker.js']
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_DATABASE:-boilerplate}?schema=public
      REDIS_URL: redis://redis:6379
      COOKIE_SECRET: ${COOKIE_SECRET:?defina no .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?defina no .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3333}
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  app:
    image: boilerplate-app:latest
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      args:
        # VITE_* são assados no bundle em build time. Ajuste para a URL pública
        # da API em produção.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      - api

volumes:
  postgresql:
  redis:
