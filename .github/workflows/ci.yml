name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas do mesmo ref quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Types · Test · Build
    runs-on: ubuntu-latest
    # Postgres para os testes de integração (gated por TEST_DATABASE_URL).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boilerplate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # .env de dev (secrets fake) — o build/lint/test não acessam o banco.
      - run: cp .env.example .env

      - run: pnpm install --frozen-lockfile

      # Cache do Turborepo entre execuções.
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Lint (Biome)
        run: pnpm lint

      # `build` roda tsc em api/app/database/api-client e, via o tsc do app/api,
      # alcança o source de ui/i18n/utils — cobre o typecheck do monorepo.
      - name: Build (typecheck + bundle)
        run: pnpm build

      # Aplica as migrations no Postgres de teste (DATABASE_URL do .env.example
      # aponta para o serviço acima). Habilita os testes de integração.
      - name: Aplicar migrations (DB de teste)
        run: pnpm --filter @repo/database exec prisma migrate deploy

      # `TEST_DATABASE_URL` liga os `*.int.test.ts` contra o Postgres do job.
      # Ela precisa estar declarada em `turbo.json` (task `test:coverage`):
      # o Turbo roda as tasks com env filtrado e, sem a declaração, a variável
      # não chega no Vitest — a integração se auto-pula e o job fica verde sem
      # ter tocado no banco.
      - name: Test (Vitest + integração + cobertura)
        run: pnpm test:coverage
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boilerplate

      - name: Upload da cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            apps/api/coverage
            apps/app/coverage
            packages/ui/coverage
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Postgres para o E2E do caminho crítico (`auth-flow.spec.ts`): ele sobe a
    # API de verdade contra este banco e faz cadastro → dashboard sem mock.
    # Aqui o banco é um serviço do runner, então não usamos o
    # `docker-compose.test.yml` (que é o caminho local, via `pnpm test:e2e`).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boilerplate_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boilerplate_e2e?schema=public
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: cp .env.example .env

      - run: pnpm install --frozen-lockfile

      # A API roda via tsx (fonte), mas importa `@repo/database` e
      # `@repo/emails` pelo **dist** — sem build, ela nem sobe. O `build` do
      # Turbo tem `dependsOn: ["^build"]`, então filtrar por `@repo/api` já
      # constrói todas as deps de workspace dela (e o `prisma generate` vem
      # junto, no build do database). `@repo/api-client` entra porque o `gen/` é
      # gitignored e o app importa os hooks ao subir o Vite.
      - name: Build das dependências (API + api-client)
        run: pnpm build --filter=@repo/api --filter=@repo/api-client

      - name: Instalar browser do Playwright
        run: pnpm --filter app exec playwright install --with-deps chromium

      - name: Aplicar migrations (DB do E2E)
        run: pnpm --filter @repo/database exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # Com `TEST_DATABASE_URL` presente, o webServer do Playwright sobe **API +
      # Vite** e o `auth-flow.spec.ts` roda o caminho crítico de verdade. Não
      # usamos o `pnpm test:e2e` da raiz aqui: ele criaria um Postgres via
      # docker compose, e o runner já oferece um como serviço.
      - name: Rodar E2E (stack completa)
        run: pnpm --filter @repo/app test:e2e

      - name: Upload do relatório (em falha)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/app/playwright-report
          retention-days: 7

  migrations:
    name: Migrations (apply + drift)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boilerplate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # DATABASE_URL do .env.example já aponta para localhost:5432/boilerplate,
      # que casa com o serviço Postgres acima.
      - run: cp .env.example .env

      - run: pnpm install --frozen-lockfile

      - name: Gerar Prisma Client
        run: pnpm db:generate

      - name: Aplicar migrations (do zero)
        run: pnpm --filter @repo/database exec prisma migrate deploy

      - name: Conferir status
        run: pnpm --filter @repo/database exec prisma migrate status

      # Drift: falha (exit 2) se schema.prisma mudou sem uma migration nova.
      - name: Checar drift (schema vs migrations)
        run: >-
          pnpm --filter @repo/database exec prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code

      - name: Validar seed
        run: pnpm db:seed

  # Gate único para a branch protection: fica verde só se TODOS os jobs acima
  # passarem. Exija apenas o check "CHECK" nas regras da branch — assim, se você
  # adicionar/renomear jobs depois, não precisa mexer na proteção.
  check:
    name: CHECK
    if: always()
    needs: [quality, e2e, migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Confirma que todos os jobs passaram
        run: |
          echo "quality=${{ needs.quality.result }} e2e=${{ needs.e2e.result }} migrations=${{ needs.migrations.result }}"
          [ "${{ needs.quality.result }}" = "success" ] \
            && [ "${{ needs.e2e.result }}" = "success" ] \
            && [ "${{ needs.migrations.result }}" = "success" ]
